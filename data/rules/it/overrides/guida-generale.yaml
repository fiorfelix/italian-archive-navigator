  - id: as-perugia-stato-civile-1861-1899
    title:
      'Provincia di Perugia: secondo originale 1861–1899 all’Archivio di Stato di Perugia (Tribunale
      di Perugia)'
    territory:
      provinces:
        - PG
    period:
      from: '1861-01-01'
      to: '1899-12-31'
    events:
      - birth
      - marriage
      - death
    regime: italian_civil
    records:
      - &id001
        it: Atti di nascita, matrimonio e morte
        en: Birth, marriage and death acts
    holders:
      - what:
          it: Primo originale dei registri
          en: First original of the registers
        office_type: stato_civile
      - what:
          it: Secondo originale (dal Tribunale) all’Archivio di Stato di Perugia
          en: Second original (from the Tribunale) at the State Archive of Perugia
        office_type: archivio_di_stato
    fallbacks:
      - it: Primo originale presso il Comune
        en: First original at the Comune
      - it: Registri parrocchiali
        en: Parish registers
