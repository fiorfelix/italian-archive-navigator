# Napoleonic civil registration (stato civile napoleonico). Each rule says whether it is verified
# from an official source and cites its sources.
version: 1
state: Periodo napoleonico
state_en: Napoleonic period
rules:
  - id: nap-lazio-umbria-1809-1814
    title: 'Lazio e Umbria annessi all’Impero francese: stato civile napoleonico'
    territory:
      regions:
        - Lazio
        - Umbria
    period:
      from: '1809-08-02'
      to: '1814-05-12'
    regime: napoleonic
    records:
      - &id001
        it: Atti di nascita, matrimonio e morte
        en: Birth, marriage and death acts
      - it: Pubblicazioni di matrimonio, allegati
        en: Marriage banns, supporting papers
    holders:
      - what:
          it:
            'Registri in duplice copia: uno al Comune, l’altro al Tribunale di prima istanza (oggi spesso
            all’Archivio di Stato)'
          en:
            'Registers in duplicate: one for the Comune, one for the Tribunale di prima istanza (today often
            at the State Archive)'
        office_type: archivio_di_stato
      - what:
          it: Esemplare comunale, se conservato
          en: Comune copy, where it survives
        office_type: stato_civile
    fallbacks: &id002
      - it: Registri parrocchiali (battesimi, matrimoni, sepolture)
        en: Parish registers (baptisms, marriages, burials)
      - it: Archivio diocesano (copie dei registri, stati delle anime)
        en: Diocesan archive (register copies, status animarum)
    notes:
      - Surviving registers mostly cover 1810–1813/1814 (Archivio di Stato di Roma 1810–1814; Trasimeno department
        1810–1813; Rieti 1810–1812).
      - Former Neapolitan parts of today’s Lazio (Gaeta, Sora, Cittaducale areas) had Neapolitan civil registration
        from 1809.
    source_url: https://archivi.cultura.gov.it/fileadmin/risorse/Guida_Generale_A_S/Roma_.pdf
    verified: true
    reviewed_for:
      - Lazio
      - Umbria
    events: &id003
      - birth
      - marriage
      - death
    sources:
      - url: https://archivi.cultura.gov.it/fileadmin/risorse/Guida_Generale_A_S/Roma_.pdf
        quote: Fu istituito con ordine della consulta straordinaria degli Stati romani del 2 ag. 1809
      - url: https://archivi.cultura.gov.it/fileadmin/risorse/Guida_Generale_A_S/Roma_.pdf
        quote:
          depositati il primo negli archivi del comune e l’altro presso la cancelleria del tribunale
          di
      - url: https://archivi.cultura.gov.it/fileadmin/risorse/Guida_Generale_A_S/Perugia_.pdf
        quote: < Stato civile del dipartimento del Trasimeno > 1810-1813, regg. 352.
      - url: https://archivi.cultura.gov.it/fileadmin/risorse/Guida_Generale_A_S/Rieti_.pdf
        quote: Atti dello stato civile del dipartimento del Tevere, regg. 11 (1810-1812).
