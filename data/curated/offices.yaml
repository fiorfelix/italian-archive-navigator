pointers:
  ufficio_documentale_militare:
    title: Ufficio documentale dell'Esercito (Army documentation office)
    rule: >-
      Esercito: for truppa, sottufficiali and ufficiali di complemento the competent office is
      the Ufficio documentale of the place of birth. For career officers it is the Ufficio
      documentale of residence until 10 years after death (20 for generals), then the
      Direzione Generale per il Personale Militare, 6ª Divisione – Servizio Esercito.
    rule_source_url: https://www.difesa.it/sgd/staff/dg/persomil/documentazione-matricolare/fogli-matricolaristato-di-servizio/24820.html
    directory_url: https://www.esercito.difesa.it/organizzazione/i-centri-documentali/uffici-relazioni-con-il-pubblico/83097.html
    directory_note: >-
      List of the Army documentation offices. Offices for Lazio, Umbria, Toscana and Marche are
      in our data; for other regions see this list.
    offices: [EUDOCEI, GMIL]
    verified: false
    # Which Army documentation office covers each province (target regions), from each office's
    # own page on esercito.difesa.it (read in a browser on 2026-11-19).
    by_province:
      - provinces: [FI, AR, GR, LI, LU, MS, PI, PO, PT, SI]
        name: Comando Militare Esercito "Toscana" – Ufficio Documentale di Firenze
        address: Via Cavour 49, 50129 Firenze
        pec: cme_toscana@postacert.difesa.it
        source_url: https://www.esercito.difesa.it/organizzazione/capo-di-sme/comando-territoriale-nazionale-esercito/comter-nord/cme-toscana/comando-militare-esercito-toscana/125326.html
        quote: L'Ufficio è competente per tutte le province della Toscana
        verified: true
      - provinces: [AN, AP, FM, MC, PU]
        name: Comando Militare Esercito "Marche" – Ufficio Documentale di Ancona
        address: Via Torrioni 10, 60122 Ancona
        pec: cme_marche@postacert.difesa.it
        source_url: https://www.esercito.difesa.it/organizzazione/capo-di-sme/comando-territoriale-nazionale-esercito/comter-sud/cme-marche/l-ufficio-documentale-di-ancona/128044.html
        quote: L'Ufficio è competente per tutte le province della Regione Marche.
        verified: true
      - provinces: [PG, TR]
        name: Comando Militare Esercito "Umbria" – Ufficio Documentale
        address: Piazza Lupattelli 1, 06123 Perugia
        pec: cme_umbria@postacert.difesa.it
        source_url: https://www.esercito.difesa.it/organizzazione/capo-di-sme/comando-territoriale-nazionale-esercito/comter-sud/cme-umbria/l-ufficio-documentale-del-cme-umbria/128045.html
        quote: E' competente per le province della regione Umbria (Perugia e Terni)
        verified: true
      - provinces: [VT]
        name: Comando Militare Esercito "Umbria" – Ufficio Documentale
        address: Piazza Lupattelli 1, 06123 Perugia
        pec: cme_umbria@postacert.difesa.it
        source_url: https://www.esercito.difesa.it/organizzazione/capo-di-sme/comando-territoriale-nazionale-esercito/comter-sud/cme-umbria/l-ufficio-documentale-del-cme-umbria/128045.html
        quote: e di Viterbo (purchè in congedo antecedentemente al 31.12.2001)
        note: For soldiers discharged on or after 31 December 2001, the Ufficio Documentale di Roma.
        verified: true
      - provinces: [RM, LT, FR, RI]
        name: Comando Territoriale Nazionale dell'Esercito – Ufficio Documentale di Roma
        address: Caserma "Scipio Slataper", Via Scipio Slataper 2, Roma
        pec: comter@postacert.difesa.it
        source_url: https://www.esercito.difesa.it/organizzazione/capo-di-sme/comando-territoriale-nazionale-esercito/l-ufficio-documentale-di-roma/125382.html
        quote: inviarlo, corredato degli eventuali allegati, agli indirizzi comter@esercito.difesa.it oppure comter@postacert.difesa.it
        note: The office page does not state which provinces it covers; Lazio is inferred because no other office lists them.
        verified: false
      - provinces: [RI]
        name: Comando Militare Esercito "Umbria" – Ufficio Documentale
        address: Piazza Lupattelli 1, 06123 Perugia
        pec: cme_umbria@postacert.difesa.it
        source_url: https://www.esercito.difesa.it/organizzazione/capo-di-sme/comando-territoriale-nazionale-esercito/comter-sud/cme-umbria/l-ufficio-documentale-del-cme-umbria/128045.html
        quote: Rieti (dalla 1958 alla 1974 e dalla 1978 in poi purchè in congedo antecedentemente al 31.12.2001)
        note: Only birth classes 1958–1974 and from 1978 (discharged before 31 December 2001); other classes most likely the Ufficio Documentale di Roma (not confirmed).
        verified: true
  diocesi:
    title: Diocesi (diocesan archive)
    rule: >-
      Parish registers and diocesan copies are kept by the parish or the diocesan archive.
      Which diocese covers this comune is not in our data.
    directory_url: https://www.chiesacattolica.it/annuario-cei/regioni-diocesi-e-parrocchie/
    directory_note: Directory of Italian dioceses and parishes by the Conferenza Episcopale Italiana.
    offices: []
    verified: false
