# Offices beyond the Comuni (SPEC §4). Contact details (address, PEC) are NOT kept here:
# refresh-data takes them from IndicePA (CC BY 4.0) and fails if a code below disappears.
#
# archivi_di_stato: which Archivio di Stato serves each province today, by IndicePA AOO code.
#   Provinces not listed fall back to the Archivio di Stato with its seat in the same province.
#   verified: true when the archive is the State Archive of that same province (IndicePA);
#   false when we assign the archive of a historical parent province.
# pointers: office types with no confirmed per-comune entry. The tool returns these as
#   verified: false, with the official directory to consult.
version: 1

